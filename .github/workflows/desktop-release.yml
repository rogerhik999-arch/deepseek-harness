name: desktop-release

# Unified three-platform desktop release. One dispatch (or a pushed desktop-*
# tag) builds mac-arm64, win-x64 and linux-x64 in parallel on hosted runners
# and attaches every artifact to ONE release page:
#   - release_tag input when given,
#   - else the pushed tag (desktop-* tags),
#   - else desktop-dev-YYYYMMDD (Asia/Shanghai), created on the fly.
# macOS uses the local self-signed "Developer ID Application" certificate;
# Windows uses the official unsigned mode; Linux packages deb + AppImage.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish under (empty = desktop-dev-YYYYMMDD today)"
        required: false
        default: ""
  push:
    tags:
      - "desktop-*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Prepare the release page
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="desktop-dev-$(TZ=Asia/Shanghai date +%Y%m%d)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "release tag: $TAG"

      - name: Create the release when missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG already exists; attaching to it"
            exit 0
          fi
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          cat > release-notes.md <<NOTES
          本地签名开发版桌面客户端（无 Apple 官方凭据，自签证书签名，未公证；Windows 为官方免签名模式；Linux 附带 SUID 沙箱配置脚本）。

          ## macOS (mac-arm64)

          - \`deepseek-harness-${VERSION}-mac-arm64.dmg\` — 自包含安装包，拖入 Applications 即可。首次打开需右键 → 打开（或 \`xattr -cr "/Applications/DeepSeek Harness.app"\`）。

          ## Windows (win-x64)

          - \`deepseek-harness-${VERSION}-win-x64-unsigned.exe\` — NSIS 安装器（官方 unsigned 模式，未做代码签名）。SmartScreen 可能提示，选择「仍要运行」即可。

          ## Linux / Ubuntu (linux-x64)

          - \`deepseek-harness-${VERSION}-linux-amd64.deb\`（推荐，Ubuntu 22.04+ / Debian）——\`sudo dpkg -i\` 安装，脚本自动配置 SUID 沙箱与 AppArmor profile。
          - \`deepseek-harness-${VERSION}-linux-x86_64.AppImage\` — 需要目标机安装 libfuse2。

          ## 说明

          - 基线：dsh \`${VERSION}\`，构建 commit ${GITHUB_SHA}（GitHub Actions 三平台并行云端构建）。
          - 安装后读写真实 \`~/.dsh\`（\`%USERPROFILE%\\.dsh\`），与 CLI/Web 共享设置、凭据与会话。
          - 自动更新源指向官方 download.deepseek.com，跨证书更新会被签名校验拒绝（预期行为）。
          NOTES
          gh release create "$TAG" --target "$GITHUB_SHA" --latest \
            --title "DeepSeek Harness Desktop ($TAG, $VERSION)" \
            --notes-file release-notes.md

  mac-arm64:
    name: Build macOS (mac-arm64)
    needs: release
    runs-on: macos-14
    timeout-minutes: 150
    env:
      DSH_DESKTOP_APP_ID: com.deepseek.harness
      DSH_DESKTOP_AUTO_UPDATE_ENV: production
      DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN: https://download.deepseek.com
      DSH_DESKTOP_MACOS_SIGNING_IDENTITY: "DeepSeek Harness Local"
      DSH_DESKTOP_MACOS_TEAM_ID: LOCALBUILD
      DSH_LOCAL_SKIP_PRIMARY_SIGNING: "1"
      DSH_DESKTOP_TARGET_PLATFORM: darwin
      DSH_DESKTOP_TARGET_ARCH: arm64
      APPLE_ID: nobody@example.com
      APPLE_APP_SPECIFIC_PASSWORD: xxxx-xxxx-xxxx-xxxx
      APPLE_TEAM_ID: LOCALBUILD
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Create local signing certificate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-signing"
          cd "$RUNNER_TEMP/dsh-signing"
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 3650 -nodes \
            -subj "/CN=Developer ID Application: DeepSeek Harness Local/OU=LOCALBUILD00/O=DeepSeek Harness Local Build/C=CN" \
            -addext "keyUsage=digitalSignature,keyCertSign" -addext "extendedKeyUsage=codeSigning"
          # Runner LibreSSL lacks -legacy; its default export is already keychain-compatible.
          openssl pkcs12 -export -legacy -out signing.p12 -inkey key.pem -in cert.pem -passout pass:ci-signing \
            || openssl pkcs12 -export -out signing.p12 -inkey key.pem -in cert.pem -passout pass:ci-signing

      - name: Create keychain and import identity
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/dsh-signing.keychain-db"
          security create-keychain -p ci-keychain-pass "$KEYCHAIN"
          security unlock-keychain -p ci-keychain-pass "$KEYCHAIN"
          # Long inactivity timeout; -t 0 would re-lock the keychain instantly and any later
          # security operation would wait forever on the headless unlock prompt.
          security set-keychain-settings -t 86400 "$KEYCHAIN"
          security import "$RUNNER_TEMP/dsh-signing/signing.p12" -k "$KEYCHAIN" -P ci-signing -T /usr/bin/codesign

      - name: Grant non-interactive keychain access
        run: |
          set -euo pipefail
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain-pass "$RUNNER_TEMP/dsh-signing.keychain-db" > /dev/null

      - name: Trust the local certificate for code signing
        run: |
          set -euo pipefail
          # Admin-domain trust for the code-signing policy; without it electron-builder
          # rejects the self-signed identity as CSSMERR_TP_NOT_TRUSTED.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/dsh-signing/cert.pem"
          security find-identity -v -p codesigning "$RUNNER_TEMP/dsh-signing.keychain-db"

      - name: Register keychain and verify identity
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/dsh-signing.keychain-db"
          # The self-signed root in the same keychain is a valid codesigning identity without
          # an explicit trust entry; add-trusted-cert is skipped (it can wait on headless UI).
          security list-keychains -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN"
          # Probe binary bound to the certificate, required by the macOS signature cache policy.
          cp /bin/echo "$RUNNER_TEMP/dsh-signing/probe"
          codesign --force --sign "Developer ID Application: DeepSeek Harness Local" --keychain "$KEYCHAIN" \
            --timestamp --options runtime "$RUNNER_TEMP/dsh-signing/probe"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "DSH_DESKTOP_MACOS_SIGNING_PROBE=$RUNNER_TEMP/dsh-signing/probe" >> "$GITHUB_ENV"

      - name: Apply local packaging patches (reverted after build)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p1 = 'apps/desktop/scripts/verify-macos-signature.mjs'
          s = open(p1).read()
          old1 = "  const missing = [expectedAuthority, expectedTeam].filter(field => !fields.has(field))"
          new1 = """  const missing = [expectedAuthority].filter(field => !fields.has(field))"""
          assert s.count(old1) == 1
          open(p1, 'w').write(s.replace(old1, new1))

          p2 = 'apps/desktop/scripts/prepare-dsh.ts'
          s = open(p2).read()
          old2 = "      await packagingStep(process.env.DSH_DESKTOP_PACKAGING_RUN_DIR, 'sign:primary-native', () => signMacOSRuntime(join(RUNTIME_ROOT, 'primary-runtime'), resolveDesktopAppId(process.env), resolveMacOSSigningEnvironment(process.env), target.arch, join(BUILD_PATHS.root, 'signature-cache')))\n    }"
          new2 = "      if (process.env.DSH_LOCAL_SKIP_PRIMARY_SIGNING !== '1') {\n        await packagingStep(process.env.DSH_DESKTOP_PACKAGING_RUN_DIR, 'sign:primary-native', () => signMacOSRuntime(join(RUNTIME_ROOT, 'primary-runtime'), resolveDesktopAppId(process.env), resolveMacOSSigningEnvironment(process.env), target.arch, join(BUILD_PATHS.root, 'signature-cache')))\n      }\n    }"
          assert s.count(old2) == 1
          open(p2, 'w').write(s.replace(old2, new2))
          print('patches applied')
          PY

      - name: Build and package (official chain)
        run: |
          set -euo pipefail
          security unlock-keychain -p ci-keychain-pass "$RUNNER_TEMP/dsh-signing.keychain-db" || true
          P="$GITHUB_WORKSPACE/apps/desktop/.desktop-build/targets/mac-arm64"
          pnpm run build:official
          pnpm run release:pack --family dsh --out "$P/packed/dsh"
          pnpm --dir apps/desktop-host pack --pack-destination "$P/packed/dsh"
          pnpm run release:pack --family vendor --out "$P/packed/vendor"
          rm -rf "$P/packed/landlock" && mkdir -p "$P/packed/landlock"
          pnpm --dir native/system run build:ts
          pnpm --dir native/system/packages/entry pack --pack-destination "$P/packed/landlock"
          pnpm --dir apps/desktop run prepare:runtime
          pnpm --dir apps/desktop run prepare:packages
          pnpm --dir apps/desktop run prepare:dsh

      - name: electron-builder and DMG
        run: |
          set -euo pipefail
          cd apps/desktop
          security unlock-keychain -p ci-keychain-pass "$CSC_KEYCHAIN"
          pnpm exec electron-builder --config electron-builder.config.mjs --mac --arm64 --dir --publish never -c.mac.notarize=false
          pnpm exec tsx scripts/smoke-packaged-runtime.ts
          VERSION="$(node -p "require('./package.json').version")"
          DMG="deepseek-harness-${VERSION}-mac-arm64.dmg"
          A=".desktop-build/targets/mac-arm64/artifacts"
          rm -rf "$A/dmg-staging" "$A/$DMG"
          mkdir -p "$A/dmg-staging"
          cp -R "$A/mac-arm64/DeepSeek Harness.app" "$A/dmg-staging/"
          ln -s /Applications "$A/dmg-staging/Applications"
          hdiutil create -volname "DeepSeek Harness" -srcfolder "$A/dmg-staging" -ov -format UDZO "$A/$DMG"
          rm -rf "$A/dmg-staging"
          echo "DSH_DMG_PATH=$PWD/$A/$DMG" >> "$GITHUB_ENV"

      - name: Revert local patches
        if: always()
        run: git checkout -- apps/desktop/scripts/verify-macos-signature.mjs apps/desktop/scripts/prepare-dsh.ts

      - name: Verify app bundle signature
        run: |
          set -euo pipefail
          APP="apps/desktop/.desktop-build/targets/mac-arm64/artifacts/mac-arm64/DeepSeek Harness.app"
          codesign --verify --deep --strict "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E "Authority=Developer ID Application: DeepSeek Harness Local"

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-mac-arm64-dmg
          path: ${{ env.DSH_DMG_PATH }}
          if-no-files-found: error

      - name: Attach DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          FILE: ${{ env.DSH_DMG_PATH }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            REL=$(curl -sS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])') && [ -n "$REL" ] && break
            echo "release lookup attempt $i failed"; sleep 15
          done
          [ -n "${REL:-}" ] || { echo "release lookup failed"; exit 1; }
          NAME=$(basename "$FILE")
          AID=$(curl -sS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$REL/assets?per_page=100" \
            | python3 -c "import json,sys;print(next((a['id'] for a in json.load(sys.stdin) if a['name']=='$NAME'),''))")
          if [ -n "$AID" ]; then
            echo "replacing existing asset $NAME"
            curl -sS --max-time 30 -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$AID"
          fi
          for i in 1 2 3; do
            curl -sS --max-time 900 -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" --data-binary "@$FILE" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$REL/assets?name=$NAME" \
              | python3 -c "import json,sys;a=json.load(sys.stdin);print('uploaded:',a.get('name'),a.get('state'))" && exit 0
            echo "upload attempt $i failed"; sleep 15
          done
          exit 1

  win-x64:
    name: Build Windows (win-x64)
    needs: release
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Write the Windows packaging environment
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=production
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://download.deepseek.com
          '@ | Out-File -Encoding utf8NoBOM apps/desktop/.env.windows

      - name: Package the win-x64 unsigned release
        shell: pwsh
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Collect installer artifacts
        shell: pwsh
        run: |
          $dir = "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts"
          Get-ChildItem $dir -File | Select-Object Name, Length
          $exe = Get-ChildItem $dir -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "no installer exe produced" }
          # Out-File truncates: every GITHUB_ENV write after the first must -Append.
          "DSH_WIN_EXE=$($exe.FullName)" | Out-File -Encoding utf8NoBOM $env:GITHUB_ENV
          $blockmap = Get-ChildItem $dir -Filter *.blockmap | Select-Object -First 1
          if ($blockmap) { "DSH_WIN_BLOCKMAP=$($blockmap.FullName)" | Out-File -Encoding utf8NoBOM -Append $env:GITHUB_ENV }

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-win-x64-unsigned
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.blockmap
          if-no-files-found: error

      - name: Attach installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        shell: pwsh
        run: |
          $H = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $rel = $null
          for ($i = 0; $i -lt 5; $i++) {
            try {
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" -Headers $H -TimeoutSec 30
              break
            } catch { Write-Host "release lookup attempt $i failed: $_"; Start-Sleep 15 }
          }
          if (-not $rel) { throw "release lookup failed" }
          $files = @($env:DSH_WIN_EXE)
          if ($env:DSH_WIN_BLOCKMAP) { $files += $env:DSH_WIN_BLOCKMAP }
          foreach ($f in $files) {
            $name = Split-Path $f -Leaf
            $existing = $rel.assets | Where-Object { $_.name -eq $name }
            if ($existing) {
              Write-Host "replacing existing asset $name"
              Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($existing.id)" -Headers $H | Out-Null
            }
            for ($i = 0; $i -lt 3; $i++) {
              try {
                Invoke-RestMethod -Method Post -Uri "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$($rel.id)/assets?name=$name" -Headers $H -InFile $f -ContentType "application/octet-stream" | Out-Null
                Write-Host "uploaded: $name"
                break
              } catch { Write-Host "upload attempt $i for $name failed: $_"; Start-Sleep 15 }
            }
          }

  linux-x64:
    name: Build Linux (linux-x64)
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # The checkout, pnpm store, runtimes and artifacts need more than the
      # preinstalled toolkits leave free on the runner.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghc || true
          df -h /

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Write the Linux packaging environment
        run: |
          cat > apps/desktop/.env.linux <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          EOF

      - name: Package the linux-x64 release
        env:
          DSH_DESKTOP_SKIP_PACKAGED_SMOKE: '1'
        run: pnpm run package:desktop:linux:x64

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-x64
          path: |
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.deb
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.AppImage
          if-no-files-found: error

      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            REL=$(curl -sS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])') && [ -n "$REL" ] && break
            echo "release lookup attempt $i failed"; sleep 15
          done
          [ -n "${REL:-}" ] || { echo "release lookup failed"; exit 1; }
          for FILE in apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.deb \
                      apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.AppImage; do
            NAME=$(basename "$FILE")
            AID=$(curl -sS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$REL/assets?per_page=100" \
              | python3 -c "import json,sys;print(next((a['id'] for a in json.load(sys.stdin) if a['name']=='$NAME'),''))")
            if [ -n "$AID" ]; then
              echo "replacing existing asset $NAME"
              curl -sS --max-time 30 -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$AID"
            fi
            for i in 1 2 3; do
              curl -sS --max-time 900 -X POST -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" --data-binary "@$FILE" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$REL/assets?name=$NAME" \
                | python3 -c "import json,sys;a=json.load(sys.stdin);print('uploaded:',a.get('name'),a.get('state'))" && break
              echo "upload attempt $i for $NAME failed"; sleep 15
            done
          done
