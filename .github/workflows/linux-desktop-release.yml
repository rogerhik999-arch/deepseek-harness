# Build the Linux desktop release on a GitHub runner and publish the
# artifacts to the release of the pushed `desktop-linux-*` tag. Public
# repository, so the built-in GITHUB_TOKEN suffices for the release.
name: linux-desktop-release

on:
  push:
    tags:
      - 'desktop-linux-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The checkout, pnpm store, runtimes and artifacts need more than the
      # preinstalled toolkits leave free on the runner.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghc || true
          df -h /

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Write the Linux packaging environment
        run: |
          cat > apps/desktop/.env.linux <<'EOF'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          EOF

      - name: Package the linux-x64 release
        env:
          DSH_DESKTOP_SKIP_PACKAGED_SMOKE: '1'
        run: pnpm run package:desktop:linux:x64

      - name: Publish the release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="desktop-linux-$(date +%Y%m%d)"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          cat > release-notes.md <<NOTES
          DeepSeek Harness 桌面客户端 Linux (Ubuntu) 版本。

          构建来源 commit $GITHUB_SHA（GitHub Actions 云端构建）。

          **deb（推荐，Ubuntu 22.04+ / Debian）**

          \`\`\`sh
          sudo dpkg -i deepseek-harness-${VERSION}-linux-amd64.deb
          \`\`\`

          安装脚本自动配置 SUID 沙箱与 AppArmor profile，并注册应用菜单图标。

          **AppImage** 需要目标机安装 libfuse2。

          已知限制见仓库 LINUX-BUILD.md（Office 转换在 Linux 使用 WASM 引擎回退）。
          NOTES
          gh release create "$TAG" --target "$GITHUB_SHA" --latest \
            --title "DeepSeek Harness Desktop for Ubuntu (linux-x64, $TAG)" \
            --notes-file release-notes.md
          gh release upload "$TAG" \
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.deb \
            apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.AppImage \
            --repo "$GITHUB_REPOSITORY" --clobber
